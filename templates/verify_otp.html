<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Verify Email - SecureChat</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Poppins:wght@600&display=swap"
        rel="stylesheet" />
</head>

<body class="bg-gray-50 dark:bg-gray-900 font-sans text-gray-900 dark:text-gray-100">
    <div class="flex min-h-screen items-center justify-center p-4">
        <div class="w-full max-w-md bg-white dark:bg-gray-800 rounded-xl shadow-lg p-8">
            <h1 class="text-2xl font-bold mb-6 text-center">Verify Your Email</h1>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div
                class="mb-4 p-3 rounded-md {{ 'bg-red-100 text-red-700' if category == 'danger' else 'bg-green-100 text-green-700' }}">
                {{ message }}
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <p class="mb-6 text-center text-gray-600 dark:text-gray-400">
                We sent a verification code to your email. Please enter it below.
            </p>

            <form method="post" class="space-y-6">
                <div>
                    <label for="otp" class="block text-sm font-medium mb-2">OTP Code</label>
                    <input type="text" id="otp" name="otp"
                        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 bg-gray-50 dark:bg-gray-700 dark:border-gray-600"
                        placeholder="123456" required pattern="\d{6}" maxlength="6" />
                </div>
                <button type="submit"
                    class="w-full py-2 px-4 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium">
                    Verify
                </button>
            </form>
        </div>
    </div>
</body>

</html>
