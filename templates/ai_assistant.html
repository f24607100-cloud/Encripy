{% extends "base_new.html" %}

{% block title %}AI Assistant{% endblock %}

{% block content %}
<div class="max-w-5xl mx-auto">
    <!-- Header -->
    <div class="mb-6">
        <div class="flex items-center gap-3 mb-2">
            <div
                class="w-12 h-12 rounded-xl bg-gradient-to-br from-primary to-blue-600 flex items-center justify-center shadow-lg">
                <span class="material-symbols-outlined text-white text-[28px]">smart_toy</span>
            </div>
            <div>
                <h1 class="text-3xl font-heading font-bold text-gray-900 dark:text-white">AI Assistant</h1>
                <p class="text-gray-500 dark:text-gray-400">Powered by ChatGPT</p>
            </div>
        </div>
    </div>

    <!-- Chat Container -->
    <div
        class="bg-white dark:bg-gray-800 rounded-2xl shadow-lg overflow-hidden border border-gray-200 dark:border-gray-700">
        <!-- Messages Area -->
        <div id="messages-container" class="h-[600px] overflow-y-auto p-6 space-y-4 bg-gray-50 dark:bg-gray-900">
            <!-- Welcome Message -->
            <div class="flex items-start gap-3">
                <div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center flex-shrink-0">
                    <span class="material-symbols-outlined text-primary text-[20px]">smart_toy</span>
                </div>
                <div class="flex-1">
                    <div
                        class="bg-white dark:bg-gray-800 rounded-2xl rounded-tl-none px-4 py-3 shadow-sm border border-gray-200 dark:border-gray-700">
                        <p class="text-gray-900 dark:text-white">👋 Hello! I'm your AI assistant. How can I help you
                            today?</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="border-t border-gray-200 dark:border-gray-700 p-4 bg-white dark:bg-gray-800">
            <div class="flex gap-3">
                <input type="text" id="user-input" placeholder="Type your message..."
                    class="flex-1 px-4 py-3 rounded-xl border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                    autocomplete="off">
                <button id="send-btn"
                    class="px-6 py-3 bg-primary hover:bg-blue-700 text-white rounded-xl font-medium transition-colors flex items-center gap-2 shadow-lg shadow-primary/25">
                    <span>Send</span>
                    <span class="material-symbols-outlined text-[20px]">send</span>
                </button>
            </div>
            <p class="text-xs text-gray-500 dark:text-gray-400 mt-2">
                💡 Tip: Press Enter to send your message
            </p>
        </div>
    </div>
</div>

<script>
    const messagesContainer = document.getElementById('messages-container');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    let conversationHistory = [];

    function scrollToBottom() {
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function addMessage(content, isUser = false) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `flex items-start gap-3 ${isUser ? 'flex-row-reverse' : ''}`;

        const avatar = document.createElement('div');
        avatar.className = `w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0 ${isUser ? 'bg-primary text-white' : 'bg-primary/10'}`;
        avatar.innerHTML = `<span class="material-symbols-outlined text-[20px] ${isUser ? 'text-white' : 'text-primary'}">${isUser ? 'person' : 'smart_toy'}</span>`;

        const bubble = document.createElement('div');
        bubble.className = 'flex-1';

        const bubbleContent = document.createElement('div');
        bubbleContent.className = `rounded-2xl px-4 py-3 shadow-sm ${isUser ? 'bg-primary text-white rounded-tr-none' : 'bg-white dark:bg-gray-800 text-gray-900 dark:text-white rounded-tl-none border border-gray-200 dark:border-gray-700'}`;
        bubbleContent.innerHTML = `<p>${content}</p>`;

        bubble.appendChild(bubbleContent);
        messageDiv.appendChild(avatar);
        messageDiv.appendChild(bubble);
        messagesContainer.appendChild(messageDiv);

        scrollToBottom();
    }

    function addLoadingMessage() {
        const loadingDiv = document.createElement('div');
        loadingDiv.id = 'loading-message';
        loadingDiv.className = 'flex items-start gap-3';
        loadingDiv.innerHTML = `
            <div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center flex-shrink-0">
                <span class="material-symbols-outlined text-primary text-[20px]">smart_toy</span>
            </div>
            <div class="flex-1">
                <div class="bg-white dark:bg-gray-800 rounded-2xl rounded-tl-none px-4 py-3 shadow-sm border border-gray-200 dark:border-gray-700">
                    <div class="flex gap-1">
                        <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0s"></div>
                        <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                        <div class="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style="animation-delay: 0.4s"></div>
                    </div>
                </div>
            </div>
        `;
        messagesContainer.appendChild(loadingDiv);
        scrollToBottom();
    }

    function removeLoadingMessage() {
        const loading = document.getElementById('loading-message');
        if (loading) loading.remove();
    }

    async function sendMessage() {
        const message = userInput.value.trim();
        if (!message) return;

        // Add user message to UI
        addMessage(message, true);
        conversationHistory.push({ role: 'user', content: message });

        // Clear input
        userInput.value = '';

        // Disable send button
        sendBtn.disabled = true;
        sendBtn.classList.add('opacity-50', 'cursor-not-allowed');

        // Show loading
        addLoadingMessage();

        try {
            const response = await fetch('/ai_assistant/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    message: message,
                    history: conversationHistory
                })
            });

            const data = await response.json();

            removeLoadingMessage();

            if (data.error) {
                addMessage(`❌ Error: ${data.error}`, false);
            } else {
                addMessage(data.response, false);
                conversationHistory.push({ role: 'assistant', content: data.response });
            }
        } catch (error) {
            removeLoadingMessage();
            addMessage(`❌ Error: ${error.message}`, false);
        } finally {
            // Re-enable send button
            sendBtn.disabled = false;
            sendBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            userInput.focus();
        }
    }

    // Event listeners
    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            sendMessage();
        }
    });

    // Focus input on load
    userInput.focus();
</script>
{% endblock %}
